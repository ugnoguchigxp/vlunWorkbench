name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify / verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run verify:strict
      - name: Measure repository coverage
        if: always()
        run: bun run coverage:repository
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            coverage/
            .artifacts/coverage/
          if-no-files-found: ignore
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scanner-e2e-real:
    needs: [verify]
    uses: ./.github/workflows/scanner-e2e-real.yml
    with:
      target_repository: ${{ vars.TODOLIST_E2E_REPOSITORY }}
      target_ref: d87bfdd9f29aa64e484a0c4d1ad02956136dc6b0
    secrets: inherit

  scanner-hardening-receipt:
    needs: [verify, scanner-e2e-real]
    if: ${{ always() && needs.verify.result == 'success' && needs.scanner-e2e-real.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Download same-commit scanner evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanner-hardening-evidence-${{ github.sha }}
          path: artifacts/scanner-e2e
      - name: Capture required checks from the GitHub branch and rules APIs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run scripts/capture-scanner-hardening-branch-protection.ts --repository "$GITHUB_REPOSITORY" --branch main --out artifacts/scanner-e2e/branch-protection.v1.json
      - name: Build immutable CI promotion receipt after required jobs
        env:
          VWB_VERIFY_CONCLUSION: ${{ needs.verify.result }}
          VWB_SCANNER_E2E_CONCLUSION: ${{ needs.scanner-e2e-real.result }}
          VWB_BRANCH_PROTECTION_EVIDENCE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && 'artifacts/scanner-e2e/branch-protection.v1.json' || '' }}
        run: bun run scripts/build-scanner-hardening-ci-receipt.ts --root artifacts/scanner-e2e --out artifacts/scanner-e2e/ci-receipt.v1.json
      - name: Verify CI receipt bindings
        run: bun run scripts/verify-scanner-hardening-ci-receipt.ts --receipt artifacts/scanner-e2e/ci-receipt.v1.json --expected-commit "$GITHUB_SHA"
      - name: Require API-confirmed protected promotion
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
        run: bun run scripts/verify-scanner-hardening-ci-receipt.ts --receipt artifacts/scanner-e2e/ci-receipt.v1.json --expected-commit "$GITHUB_SHA" --require-protected
      - name: Upload immutable closeout artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-hardening-closeout-${{ github.sha }}
          path: artifacts/scanner-e2e/
          if-no-files-found: error
          retention-days: 30

  juice-shop-benchmark:
    needs: [verify, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VULN_WORKBENCH_OWASP_SEMGREP_IMAGE: docker.io/semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
      VULN_WORKBENCH_TOOLBOX_IMAGE_DIGEST: sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
      VULN_WORKBENCH_PHASE54_REGRESSION_VERIFIED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prepare pinned benchmark corpora
        run: bun run security-corpora:prepare
      - name: Preload pinned Semgrep benchmark image
        run: docker pull "$VULN_WORKBENCH_OWASP_SEMGREP_IMAGE"
      - name: Preload pinned Juice Shop image
        run: docker pull docker.io/bkimminich/juice-shop@sha256:cd58d79c5cb4d82f22fbaf616f9ff43bbd04ba630cd6b448a9ed99cf652fcebf
      - name: Create isolated benchmark database
        env:
          DATABASE_URL: file:${{ runner.temp }}/phase-54-closeout.sqlite
        run: bun run db:migrate
      - name: Run authoritative Phase 54 closeout and strict Phase 55 entry
        env:
          DATABASE_URL: file:${{ runner.temp }}/phase-54-closeout.sqlite
          VULN_WORKBENCH_BENCHMARK_DATABASE_URL: file:${{ runner.temp }}/phase-54-closeout.sqlite
          VULN_WORKBENCH_BENCHMARK_DATABASE_BACKUP_PATH: ${{ runner.temp }}/phase-54-closeout-backup.sqlite
        run: bun run verify:phase-55-entry
      - name: Upload closeout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-54-same-commit-closeout
          path: |
            .artifacts/benchmark/owasp-findings.json
            .artifacts/benchmark/owasp-metrics.json
            .artifacts/benchmark/owasp-run.json
            .artifacts/benchmark/owasp-semgrep-raw.json
            .artifacts/benchmark/juice-shop-evidence/
            .artifacts/benchmark/juice-shop-metrics.json
            .artifacts/benchmark/juice-shop-observations.json
            .artifacts/benchmark/juice-shop-run.json
            .artifacts/phase-54-closeout/
            .artifacts/phase-55-entry/
            .artifacts/professional-capability-release-report.json
            ${{ runner.temp }}/phase-54-closeout-backup.sqlite
          if-no-files-found: error
