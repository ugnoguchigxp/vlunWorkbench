name: scanner-e2e-real

on:
  workflow_call:
    inputs:
      target_repository:
        description: Immutable todolist target repository (owner/name).
        required: true
        type: string
      target_ref:
        description: Commit SHA required by spec/security-capability/todolist-scan-target.v1.json.
        required: true
        type: string
    secrets:
      TODOLIST_READ_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      target_repository:
        description: Immutable todolist target repository (owner/name).
        required: true
        type: string
      target_ref:
        description: Commit SHA required by spec/security-capability/todolist-scan-target.v1.json.
        required: true
        type: string

permissions:
  contents: read

jobs:
  scanner-e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Check out the pinned E2E target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
          path: todolist
          token: ${{ secrets.TODOLIST_READ_TOKEN || github.token }}
          fetch-depth: 1
      - run: bun install --frozen-lockfile
      - name: Build the pinned toolbox required by Semgrep E2E
        run: bun run docker:toolbox:build vuln-workbench-toolbox:local
      - name: Run the complete real-scanner release gate
        env:
          VULN_WORKBENCH_TODOLIST_REPO_PATH: ${{ github.workspace }}/todolist
        run: bun run test:scanner-e2e
      - name: Upload scanner E2E evidence and qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-e2e-real
          path: artifacts/scanner-e2e/
          if-no-files-found: error
          retention-days: 30
