name: scanner-e2e-real

on:
  workflow_call:
    inputs:
      target_repository:
        description: Immutable todolist target repository (owner/name).
        required: true
        type: string
      target_ref:
        description: Commit SHA required by spec/security-capability/todolist-scan-target.v1.json.
        required: true
        type: string
    secrets:
      TODOLIST_READ_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      target_repository:
        description: Immutable todolist target repository (owner/name).
        required: true
        type: string
      target_ref:
        description: Commit SHA required by spec/security-capability/todolist-scan-target.v1.json.
        required: true
        type: string

permissions:
  contents: read

jobs:
  scanner-e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # pinned
        with:
          version: v0.72.0
      - name: Validate immutable target inputs
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "target_source_unavailable" >&2; exit 2; }
          [[ "$TARGET_REF" == "d87bfdd9f29aa64e484a0c4d1ad02956136dc6b0" ]] || { echo "target_ref_mismatch" >&2; exit 2; }
      - name: Check out the pinned E2E target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
          path: todolist
          token: ${{ secrets.TODOLIST_READ_TOKEN || github.token }}
          fetch-depth: 1
      - name: Verify checked out target identity
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          test "$(git -C todolist rev-parse HEAD)" = "$TARGET_REF"
          test -z "$(git -C todolist status --porcelain=v1 --untracked-files=all)"
          test "$(jq -r .commit spec/security-capability/todolist-scan-target.v1.json)" = "$TARGET_REF"
      - run: bun install --frozen-lockfile
      - name: Preload pinned ZAP baseline image
        run: docker pull zaproxy/zap-stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
      - name: Run the complete real-scanner release gate
        env:
          VULN_WORKBENCH_TODOLIST_REPO_PATH: ${{ github.workspace }}/todolist
        run: |
          bun run test:scanner-e2e
          bun run scanner-e2e:failure
          bun run scanner-e2e:failure:verify
          bun run scanner-hardening:baseline:verify
          bun run scanner-hardening:dod:verify
      - name: Upload scanner E2E evidence and qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-hardening-evidence-${{ github.sha }}
          path: artifacts/scanner-e2e/
          if-no-files-found: error
          retention-days: 30
