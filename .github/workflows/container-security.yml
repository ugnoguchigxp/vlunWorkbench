name: container-security

on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "scripts/build-*-image.ts"
      - "scripts/prepare-scanner-data.ts"
      - "scripts/verify-offline-toolbox.ts"
      - "scripts/benchmark/dast-*.ts"
      - "scripts/verify-dast-*.ts"
      - "api/modules/dast/**"
      - "api/modules/dynamic/**"
      - "api/modules/runtime-scans/**"
      - "api/modules/api-schema-fuzz/**"
      - "api/modules/scans/tools/**"
      - "shared/schemas/dast*.ts"
      - "spec/security-capability/dast-standard-*.json"
      - "tests/security-capability/dast-standard/**"
      - "tests/security-capability/go-fuzz/**"
      - "tests/security-capability/go-race/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/container-security.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "scripts/build-*-image.ts"
      - "scripts/prepare-scanner-data.ts"
      - "scripts/verify-offline-toolbox.ts"
      - "scripts/benchmark/dast-*.ts"
      - "scripts/verify-dast-*.ts"
      - "api/modules/dast/**"
      - "api/modules/dynamic/**"
      - "api/modules/runtime-scans/**"
      - "api/modules/api-schema-fuzz/**"
      - "api/modules/scans/tools/**"
      - "shared/schemas/dast*.ts"
      - "spec/security-capability/dast-standard-*.json"
      - "tests/security-capability/dast-standard/**"
      - "tests/security-capability/go-fuzz/**"
      - "tests/security-capability/go-race/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/container-security.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: toolbox
            dockerfile: docker/toolbox/Dockerfile
          - name: dynamic
            dockerfile: docker/dynamic/Dockerfile
          - name: semgrep
            dockerfile: docker/plugins/semgrep/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # pinned
        with:
          version: v0.72.0
          cache: true
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build toolbox with pinned scanner data
        if: matrix.name == 'toolbox' || matrix.name == 'semgrep'
        run: bun run docker:toolbox:build vuln-workbench-toolbox:ci
      - name: Verify toolbox without network access
        if: matrix.name == 'toolbox'
        env:
          VULN_WORKBENCH_TOOLBOX_IMAGE: vuln-workbench-toolbox:ci
        run: bun run verify:toolbox-offline
      - name: Run owned DAST real-scanner gate
        if: matrix.name == 'toolbox'
        env:
          VULN_WORKBENCH_TOOLBOX_IMAGE: vuln-workbench-toolbox:ci
        run: bun run benchmark:dast-real-scanners
      - name: Verify owned DAST real-scanner evidence
        if: matrix.name == 'toolbox'
        run: bun run verify:dast-real-scanners
      - name: Build dynamic image
        if: matrix.name == 'dynamic'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: vuln-workbench-${{ matrix.name }}:ci
      - name: Run isolated dynamic security recipes
        if: matrix.name == 'dynamic'
        env:
          VULN_WORKBENCH_DYNAMIC_INTEGRATION: "1"
          VULN_WORKBENCH_DYNAMIC_TEST_IMAGE: vuln-workbench-dynamic:ci
        run: bun test api/modules/dynamic/dynamic-security-recipe.integration.test.ts
      - name: Build optional Semgrep image from the verified toolbox
        if: matrix.name == 'semgrep'
        run: >-
          docker build
          --build-arg BASE_IMAGE=vuln-workbench-toolbox:ci
          --file docker/plugins/semgrep/Dockerfile
          --tag vuln-workbench-semgrep:ci
          .
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vuln-workbench-${{ matrix.name }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
          skip-setup-trivy: true
      - name: Block High and Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action's `trivyignores` input concatenates files into an
          # extensionless legacy-format file. Preserve YAML parsing instead.
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: vuln-workbench-${{ matrix.name }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          retention-days: 30
      - name: Upload DAST real-scanner evidence
        if: always() && matrix.name == 'toolbox'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-real-scanners
          path: |
            .artifacts/benchmark/dast-real-scanners.json
            .artifacts/benchmark/dast-real-scanner-evidence/
          if-no-files-found: error
          retention-days: 30
