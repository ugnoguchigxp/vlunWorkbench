name: container-security

on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "scripts/build-*-image.ts"
      - ".github/workflows/container-security.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "scripts/build-*-image.ts"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: toolbox
            dockerfile: docker/toolbox/Dockerfile
          - name: dynamic
            dockerfile: docker/dynamic/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: vuln-workbench-${{ matrix.name }}:ci
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: vuln-workbench-${{ matrix.name }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
      - name: Block High and Critical findings
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: vuln-workbench-${{ matrix.name }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          retention-days: 30
