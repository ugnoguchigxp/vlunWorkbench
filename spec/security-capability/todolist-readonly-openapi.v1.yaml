openapi: 3.0.3
info:
  title: todolist acceptance read-only API
  version: 1.0.0
servers:
  - url: http://127.0.0.1
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: service health
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [hono-standard]
