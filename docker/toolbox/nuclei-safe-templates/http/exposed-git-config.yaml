id: exposed-git-config

info:
  name: Exposed Git configuration
  author: vuln-workbench
  severity: medium
  description: A Git repository configuration is publicly readable.
  tags: exposure,misconfiguration,safe

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    matchers:
      - type: dsl
        condition: and
        dsl:
          - "status_code == 200"
          - "len(body) < 131072"
          - "contains_all(to_lower(body), '[core]', 'repositoryformatversion')"
