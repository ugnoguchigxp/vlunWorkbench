id: credentialed-cors-origin-reflection

info:
  name: Credentialed CORS origin reflection
  author: vuln-workbench
  severity: medium
  description: An untrusted Origin is reflected while credentials are allowed.
  tags: cors,misconfiguration,safe

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/data"
    headers:
      Origin: "https://attacker.invalid"
    matchers:
      - type: dsl
        condition: and
        dsl:
          - "status_code >= 200 && status_code < 400"
          - "contains(to_lower(all_headers), 'access-control-allow-origin: https://attacker.invalid')"
          - "contains(to_lower(all_headers), 'access-control-allow-credentials: true')"
