id: exposed-env-file

info:
  name: Exposed environment file
  author: vuln-workbench
  severity: high
  description: An environment file is publicly readable by the local auto-started target.
  tags: exposure,misconfiguration,safe

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
    matchers:
      - type: dsl
        condition: and
        dsl:
          - "status_code == 200"
          - "len(body) < 131072"
          - "regex('(?mi)^(?:[A-Z][A-Z0-9_]{2,})\\s*=\\s*[^\\r\\n]+$', body)"
          - "contains_any(to_lower(body), 'database_url=', 'db_password=', 'secret_key=', 'api_key=', 'aws_access_key_id=')"
