rules:
  - id: vuln-workbench.javascript.child-process-shell
    message: Untrusted input may reach a shell command.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: CWE-78
      source: vuln-workbench
      version: "1"
    patterns:
      - pattern-either:
          - pattern: child_process.exec($X, ...)
          - pattern: child_process.execSync($X, ...)
      - pattern-not: child_process.exec("...", ...)
      - pattern-not: child_process.execSync("...", ...)
  - id: vuln-workbench.javascript.weak-random-token
    message: Math.random is not suitable for security tokens.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: CWE-338
      source: vuln-workbench
      version: "1"
    patterns:
      - pattern: Math.random()
  - id: vuln-workbench.python.shell-true
    message: subprocess with shell=True expands the command through a shell.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: CWE-78
      source: vuln-workbench
      version: "1"
    patterns:
      - pattern: subprocess.$F(..., shell=True, ...)
